# Ships the MCP Worker once main is green.
#
# Separate from CI on purpose. While this lived inside the CI workflow, a deploy it
# could not complete — the Cloudflare credentials were unset — made every run on main
# conclude `failure`, and Railway, which waits for a green CI before releasing the
# editor, never released one. A deploy that cannot run must not decide whether some
# other service ships, so it reports on its own.
name: Deploy MCP Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only a green CI run releases; workflow_dispatch is the manual escape hatch.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mcp.andypeterson.dev
    # A deploy already under way finishes; the next one queues behind it.
    concurrency:
      group: deploy-cv-mcp
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run starts from the default branch, so name the commit that passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Check the Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Unset on the production environment:$missing — set each with 'gh secret set <NAME> --env production'"
            exit 1
          fi
      - name: Deploy with the lockfile's wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-check the live Worker
        run: |
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors \
            https://mcp.andypeterson.dev/.well-known/oauth-protected-resource | grep -q '"resource"'
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mcp.andypeterson.dev/mcp)
          [ "$code" = 401 ] || { echo "expected 401 from /mcp, got $code"; exit 1; }
