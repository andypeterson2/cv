name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  mcp-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          (cd editor && npm ci)
          pip install pytest jsonschema "ruff~=0.15.16"
      - name: Lint the contract tests
        run: ruff check .
      - name: Boot the editor and run the live-HTTP contract tests
        run: |
          cd editor
          PORT=3001 HOST=127.0.0.1 CV_DB_PATH="$RUNNER_TEMP/cv-contract.db" CV_EMBED_OFFLINE=1 node server.js &
          cd "$GITHUB_WORKSPACE"
          curl --retry 40 --retry-delay 1 --retry-connrefused -sf http://127.0.0.1:3001/health
          CV_EDITOR_URL=http://127.0.0.1:3001 python -m pytest tests/contract/ -v
