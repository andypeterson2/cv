name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            resume.tex
            coverletter.tex
          latexmk_use_xelatex: true
          pre_compile: |
            cp -r /opt/texlive/texdir/texmf-dist/fonts/opentype/google/roboto /usr/share/fonts/roboto 2>/dev/null || true
            cp -r /opt/texlive/texdir/texmf-dist/fonts/opentype/adobe/sourcesanspro /usr/share/fonts/sourcesanspro 2>/dev/null || true
            fc-cache -fv
