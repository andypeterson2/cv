name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm test

  mcp-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          (cd editor && npm install)
          pip install pytest jsonschema "ruff~=0.15.16"
      - name: Lint the contract tests
        run: ruff check .
      - name: Boot the editor and run the live-HTTP contract tests
        run: |
          cd editor
          PORT=3001 HOST=127.0.0.1 CV_DB_PATH="$RUNNER_TEMP/cv-contract.db" CV_EMBED_OFFLINE=1 node server.js &
          cd "$GITHUB_WORKSPACE"
          curl --retry 40 --retry-delay 1 --retry-connrefused -sf http://127.0.0.1:3001/health
          CV_EDITOR_URL=http://127.0.0.1:3001 python -m pytest tests/contract/ -v

  # Ships the MCP Worker once main is green. Its Cloudflare credentials live in the
  # `production` environment, which only main may deploy from.
  deploy-mcp-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, mcp-worker, contract]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mcp.andypeterson.dev
    # A deploy already under way finishes; the next one queues behind it.
    concurrency:
      group: deploy-cv-mcp
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Deploy with the lockfile's wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-check the live Worker
        run: |
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors \
            https://mcp.andypeterson.dev/.well-known/oauth-protected-resource | grep -q '"resource"'
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mcp.andypeterson.dev/mcp)
          [ "$code" = 401 ] || { echo "expected 401 from /mcp, got $code"; exit 1; }
