name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          (cd editor && npm install)
          pip install pytest jsonschema
      - name: Boot the editor and run the live-HTTP contract tests
        run: |
          cd editor
          PORT=3001 HOST=127.0.0.1 CV_DB_PATH="$RUNNER_TEMP/cv-contract.db" CV_EMBED_OFFLINE=1 node server.js &
          cd "$GITHUB_WORKSPACE"
          curl --retry 40 --retry-delay 1 --retry-connrefused -sf http://127.0.0.1:3001/health
          CV_EDITOR_URL=http://127.0.0.1:3001 python -m pytest tests/contract/ -v

  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            resume.tex
            coverletter.tex
          latexmk_use_lualatex: true
          pre_compile: |
            apk add --no-cache curl unzip fontconfig
            mkdir -p /usr/share/fonts/source-sans /usr/share/fonts/roboto
            curl -fsSL -o /tmp/source-sans.zip "https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip"
            unzip -o /tmp/source-sans.zip -d /tmp/source-sans
            find /tmp/source-sans -name '*.otf' -exec cp {} /usr/share/fonts/source-sans/ \;
            curl -fsSL -o /tmp/roboto.zip "https://github.com/googlefonts/roboto/releases/download/v2.138/roboto-android.zip"
            unzip -o /tmp/roboto.zip -d /tmp/roboto
            find /tmp/roboto -name '*.ttf' -exec cp {} /usr/share/fonts/roboto/ \;
            fc-cache -f
            rm -rf /tmp/source-sans.zip /tmp/source-sans /tmp/roboto.zip /tmp/roboto
