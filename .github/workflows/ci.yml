name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            resume.tex
            coverletter.tex
          latexmk_use_lualatex: true
          pre_compile: "printf '<?xml version=\"1.0\"?>\\n<fontconfig>\\n<dir>/opt/texlive/texdir/texmf-dist/fonts/opentype</dir>\\n<dir>/opt/texlive/texdir/texmf-dist/fonts/truetype</dir>\\n</fontconfig>' > /etc/fonts/local.conf && fc-cache -f"
