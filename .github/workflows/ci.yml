name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            resume.tex
            coverletter.tex
          latexmk_use_xelatex: true
          pre_compile: |
            mkdir -p /usr/share/fonts/custom
            find /opt/texlive -name "*.otf" -path "*roboto*" -exec cp {} /usr/share/fonts/custom/ \; 2>/dev/null || true
            find /opt/texlive -name "*.otf" -path "*sourcesanspro*" -exec cp {} /usr/share/fonts/custom/ \; 2>/dev/null || true
            find /opt/texlive -name "*.otf" -path "*SourceSans*" -exec cp {} /usr/share/fonts/custom/ \; 2>/dev/null || true
            ls /usr/share/fonts/custom/ || true
            fc-cache -fv
            fc-list | grep -i "source\|roboto" || echo "WARNING: fonts not found"
