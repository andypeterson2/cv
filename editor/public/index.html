<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visual editor for LaTeX resume, CV, and cover letter documents">
  <title>CV Editor</title>
  <script src="https://andypeterson2.github.io/ui-kit/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="https://andypeterson2.github.io/ui-kit/ui-kit.css">
  <script src="https://andypeterson2.github.io/ui-kit/service-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

  <!-- Modal overlay -->
  <div class="modal-overlay" x-show="modal.open" @click.self="cancelModal()" x-cloak>
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <h3 x-text="modal.title" class="modal-title"></h3>
      <template x-for="(field, fi) in modal.fields" :key="fi">
        <label class="modal-field">
          <span x-text="field.label"></span>
          <input type="text" x-model="field.value" @keydown.enter="submitModal()" :autofocus="fi === 0">
        </label>
      </template>
      <div class="modal-actions">
        <button class="btn" @click="submitModal()">OK</button>
        <button class="btn btn-secondary" @click="cancelModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Top bar -->
  <header class="topbar" role="banner">
    <h1 class="topbar-title">CV Editor</h1>
    <div class="actions">
      <div id="backend-connect"></div>
      <button class="btn compile" @click="compile()" :disabled="compiling" aria-label="Compile document to PDF">
        <span x-show="!compiling">Compile</span>
        <span x-show="compiling">Compiling...</span>
      </button>
      <button class="btn theme-toggle" @click="toggleTheme()" :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'" x-text="darkMode ? 'Light' : 'Dark'"></button>
      <button class="btn" @click="showPdf = !showPdf" x-text="showPdf ? 'Hide PDF' : 'Show PDF'" aria-label="Toggle PDF preview"></button>
      <button class="btn" @click="exportData()" aria-label="Export data as JSON">Export</button>
      <button class="btn" @click="importData()" aria-label="Import data from JSON">Import</button>
      <button class="btn" @click="resetFromServer()" aria-label="Reset data from server">Reset</button>
    </div>
  </header>

  <!-- Main layout: split pane -->
  <div class="split-layout">
    <!-- Left column: editor -->
    <div class="left-col ui-scrollbar-thin">
      <!-- Editor tabs -->
      <div class="ui-tabs">
        <button class="ui-tab" :class="{ active: editorTab === 'profile' }" @click="editorTab = 'profile'">Profile</button>
        <button class="ui-tab" :class="{ active: editorTab === 'sections' }" @click="editorTab = 'sections'">Sections</button>
        <button class="ui-tab" :class="{ active: editorTab === 'coverletter' }" @click="editorTab = 'coverletter'">Cover Ltr</button>
        <button class="ui-tab" :class="{ active: editorTab === 'style' }" @click="editorTab = 'style'">Style</button>
      </div>

      <div class="ui-alert" x-show="statusMsg" x-text="statusMsg" :class="statusType" role="status"></div>

          <div id="section-list" class="section-list">
            <template x-for="(sec, i) in docSections" :key="sec.file">
              <div class="section-card" :class="{ disabled: !sec.enabled }" :data-index="i" :data-sec-file="sec.file">
                <div class="section-header">
                  <span class="ui-drag-handle section-drag" aria-hidden="true">&#x283F;</span>
                  <strong x-text="sectionTitle(sec.file)"></strong>
                  <label class="toggle-label" title="Include in CV">
                    <input type="checkbox" :checked="sec.enabled" @change="toggleSection(i)" :aria-label="'Enable ' + sectionTitle(sec.file)">
                  </label>
                  <label class="resume-toggle" title="Include in Resume">
                    <span class="ui-badge resume-tag">R</span>
                    <input type="checkbox" :checked="isResumeSection(sec.file)" @change="toggleResumeSection(sec.file)" :aria-label="'Include ' + sectionTitle(sec.file) + ' in resume'">
                  </label>
                  <button class="btn-sm" @click="sec._expanded = !sec._expanded"
                    x-text="sec._expanded ? 'Collapse' : 'Expand'"></button>
                </div>

      <!-- ===== Sections Tab ===== -->
      <div x-show="editorTab === 'sections'" class="tab-content">
        <div class="section-toolbar">
          <button class="btn-sm" @click="createNewSection()">+ Add Section</button>
          <button class="btn-sm" @click="docSections.forEach(s => { s._expanded = true; loadSectionData(s) })">Expand All</button>
          <button class="btn-sm" @click="docSections.forEach(s => { s._expanded = false })">Collapse All</button>
        </div>
        <div id="section-list" class="section-list">
          <template x-for="(sec, i) in docSections" :key="sec.id">
            <div class="section-card" :class="{ disabled: !sec.enabled }" :data-sec-id="sec.id">
              <div class="section-header">
                <span class="ui-drag-handle section-drag" aria-hidden="true">&#x283F;</span>
                <span class="expand-arrow" @click="sec._expanded = !sec._expanded; if(sec._expanded) loadSectionData(sec)"
                  :title="sec._expanded ? 'Collapse' : 'Expand'"
                  x-text="sec._expanded ? '\u2191' : '\u2193'"></span>
                <input type="text" class="section-title-input" :value="sec.title"
                  @change="saveSectionTitle(sec.id, $event.target.value)"
                  @keydown.enter="$event.target.blur()">
                <label class="toggle-label-inline" title="Include in document">
                  <input type="checkbox" :checked="sec.enabled" @change="toggleSection(i)" :aria-label="'Enable ' + sec.title">
                </label>
              </div>

              <!-- Expanded editor -->
              <div x-show="sec._expanded && sec.enabled" class="section-body">
                <template x-if="sec._data">
                  <div>
                    <!-- cventries editor -->
                    <template x-if="sec._data.type === 'cventries'">
                      <div>
                        <template x-for="entry in sec._data.entries" :key="entry.id">
                          <div class="entry-card" :class="{ 'resume-off': !entry.resumeIncluded }">
                            <div class="entry-header">
                              <strong x-text="entry.fields.organization || entry.fields.position"></strong>
                              <div class="entry-header-actions">
                                <label class="resume-toggle" title="Include in Resume">
                                  <span class="ui-badge resume-tag">R</span>
                                  <input type="checkbox" :checked="entry.resumeIncluded" @change="toggleResumeEntry(entry)" aria-label="Include entry in resume">
                                </label>
                                <button class="btn-danger btn-sm" @click="removeEntry(sec, entry.id)">Remove</button>
                              </div>
                            </div>
                            <label>Position <input type="text" x-model="entry.fields.position" @input="autoSaveEntry(entry)"></label>
                            <label>Organization <input type="text" x-model="entry.fields.organization" @input="autoSaveEntry(entry)"></label>
                            <label>Location <input type="text" x-model="entry.fields.location" @input="autoSaveEntry(entry)"></label>
                            <label>Date <input type="text" x-model="entry.fields.date" @input="autoSaveEntry(entry)"></label>
                            <div class="items-list" :data-entry-id="entry.id" :data-sec-id="sec.id">
                              <strong>Bullet Points</strong>
                              <template x-for="item in entry.items" :key="item.id">
                                <div class="item-row" :class="{ 'resume-off': !item.resumeIncluded }">
                                  <span class="ui-drag-handle" aria-hidden="true"></span>
                                  <textarea x-model="item.content" rows="2" @input="autoSaveItem(item)" :aria-label="'Bullet point'"></textarea>
                                  <label class="resume-toggle-inline" title="Include in Resume">
                                    <span class="ui-badge resume-tag-sm">R</span>
                                    <input type="checkbox" :checked="item.resumeIncluded" @change="toggleResumeItem(item)">
                                  </label>
                                  <button class="btn-danger btn-xs" @click="removeItem(entry, item.id)" aria-label="Remove bullet point">x</button>
                                </div>
                              </template>
                              <button class="btn-sm" @click="addItem(entry)">+ Add Bullet</button>
                            </div>
                          </div>
                        </template>
                        <button class="btn" @click="addEntry(sec)">+ Add Entry</button>
                      </div>
                    </template>

                    <!-- cvskills editor -->
                    <template x-if="sec._data.type === 'cvskills'">
                      <div>
                        <template x-for="entry in sec._data.entries" :key="entry.id">
                          <div class="entry-card compact" :class="{ 'resume-off': !entry.resumeIncluded }">
                            <div class="entry-header">
                              <strong x-text="entry.fields.category"></strong>
                              <div class="entry-header-actions">
                                <label class="resume-toggle" title="Include in Resume">
                                  <span class="ui-badge resume-tag">R</span>
                                  <input type="checkbox" :checked="entry.resumeIncluded" @change="toggleResumeEntry(entry)">
                                </label>
                                <button class="btn-danger btn-xs" @click="removeEntry(sec, entry.id)">Remove</button>
                              </div>
                            </div>
                            <label>Category <input type="text" x-model="entry.fields.category" @input="autoSaveEntry(entry)"></label>
                            <label>Skills <input type="text" x-model="entry.fields.skills" @input="autoSaveEntry(entry)"></label>
                          </div>
                        </template>
                        <button class="btn-sm" @click="addEntry(sec)">+ Add Skill</button>
                      </div>
                    </template>

                    <!-- cvhonors editor -->
                    <template x-if="sec._data.type === 'cvhonors'">
                      <div>
                        <template x-for="entry in sec._data.entries" :key="entry.id">
                          <div class="entry-card compact" :class="{ 'resume-off': !entry.resumeIncluded }">
                            <div class="entry-header">
                              <strong x-text="entry.fields.award"></strong>
                              <div class="entry-header-actions">
                                <label class="resume-toggle" title="Include in Resume">
                                  <span class="ui-badge resume-tag">R</span>
                                  <input type="checkbox" :checked="entry.resumeIncluded" @change="toggleResumeEntry(entry)">
                                </label>
                                <button class="btn-danger btn-xs" @click="removeEntry(sec, entry.id)">Remove</button>
                              </div>
                            </div>
                            <label>Award <input type="text" x-model="entry.fields.award" @input="autoSaveEntry(entry)"></label>
                            <label>Issuer <input type="text" x-model="entry.fields.issuer" @input="autoSaveEntry(entry)"></label>
                            <label>Location <input type="text" x-model="entry.fields.location" @input="autoSaveEntry(entry)"></label>
                            <label>Date <input type="text" x-model="entry.fields.date" @input="autoSaveEntry(entry)"></label>
                          </div>
                        </template>
                        <button class="btn-sm" @click="addEntry(sec)">+ Add Honor</button>
                      </div>
                    </template>

                    <!-- cvreferences editor -->
                    <template x-if="sec._data.type === 'cvreferences'">
                      <div>
                        <template x-for="entry in sec._data.entries" :key="entry.id">
                          <div class="entry-card compact" :class="{ 'resume-off': !entry.resumeIncluded }">
                            <div class="entry-header">
                              <strong x-text="entry.fields.name"></strong>
                              <div class="entry-header-actions">
                                <label class="resume-toggle" title="Include in Resume">
                                  <span class="ui-badge resume-tag">R</span>
                                  <input type="checkbox" :checked="entry.resumeIncluded" @change="toggleResumeEntry(entry)">
                                </label>
                                <button class="btn-danger btn-xs" @click="removeEntry(sec, entry.id)">Remove</button>
                              </div>
                            </div>
                            <label>Name <input type="text" x-model="entry.fields.name" @input="autoSaveEntry(entry)"></label>
                            <label>Relation <input type="text" x-model="entry.fields.relation" @input="autoSaveEntry(entry)"></label>
                            <label>Phone <input type="text" x-model="entry.fields.phone" @input="autoSaveEntry(entry)"></label>
                            <label>Email <input type="text" x-model="entry.fields.email" @input="autoSaveEntry(entry)"></label>
                          </div>
                        </template>
                        <button class="btn-sm" @click="addEntry(sec)">+ Add Reference</button>
                      </div>
                    </template>

                    <!-- cvparagraph editor -->
                    <template x-if="sec._data.type === 'cvparagraph'">
                      <div>
                        <template x-if="sec._data.entries.length > 0">
                          <div>
                            <label class="paragraph-label">CV Text</label>
                            <textarea x-model="sec._data.entries[0].fields.text" rows="4" class="full-width" @input="autoSaveParagraph(sec)" aria-label="CV summary text"></textarea>
                            <label class="paragraph-label">Resume Text <span class="muted">(shorter version for resume)</span></label>
                            <textarea x-model="sec.resumeParagraphText" @input="autoSaveResumeParagraphText(sec)" rows="3" class="full-width" aria-label="Resume summary text"></textarea>
                          </div>
                        </template>
                      </div>

                      <!-- cventries editor -->
                      <template x-if="sec._data.type === 'cventries'">
                        <div>
                          <template x-for="(entry, ei) in sec._data.entries" :key="ei">
                            <div class="entry-card" :class="{ 'resume-off': !isResumeEntry(sec.file, ei) }">
                              <div class="entry-header">
                                <strong x-text="entry.organization || entry.position"></strong>
                                <div class="entry-header-actions">
                                  <label class="resume-toggle" title="Include in Resume">
                                    <span class="ui-badge resume-tag">R</span>
                                    <input type="checkbox" :checked="isResumeEntry(sec.file, ei)" @change="toggleResumeEntry(sec.file, ei)" :aria-label="'Include entry in resume'">
                                  </label>
                                  <button class="btn-danger btn-sm" @click="removeEntry(sec, ei)">Remove</button>
                                </div>
                              </div>
                              <label>Position <input type="text" x-model="entry.position"></label>
                              <label>Organization <input type="text" x-model="entry.organization"></label>
                              <label>Location <input type="text" x-model="entry.location"></label>
                              <label>Date <input type="text" x-model="entry.date"></label>
                              <div class="items-list" :data-entry-idx="ei" :data-sec-file="sec.file">
                                <strong>Bullet Points</strong>
                                <template x-for="(item, ii) in entry.items" :key="ii">
                                  <div class="item-row" :class="{ 'resume-off': !isResumeBullet(sec.file, ei, ii) }">
                                    <span class="ui-drag-handle" aria-hidden="true"></span>
                                    <textarea x-model="entry.items[ii]" rows="2" :aria-label="'Bullet point ' + (ii + 1)"></textarea>
                                    <label class="resume-toggle-inline" title="Include in Resume">
                                      <span class="ui-badge resume-tag-sm">R</span>
                                      <input type="checkbox" :checked="isResumeBullet(sec.file, ei, ii)" @change="toggleResumeBullet(sec.file, ei, ii)">
                                    </label>
                                    <button class="btn-danger btn-xs" @click="removeBullet(sec, entry, ei, ii)" aria-label="Remove bullet point">x</button>
                                  </div>
                                </template>
                                <button class="btn-sm" @click="addBullet(sec, entry, ei)">+ Add Bullet</button>
                              </div>
                            </div>
                          </template>
                          <button class="btn" @click="addCventry(sec)">+ Add Entry</button>
                        </div>
                      </template>

                      <!-- cvskills editor -->
                      <template x-if="sec._data.type === 'cvskills'">
                        <div>
                          <template x-for="(entry, ei) in sec._data.entries" :key="ei">
                            <div class="entry-card compact" :class="{ 'resume-off': !isResumeEntry(sec.file, ei) }">
                              <div class="entry-header">
                                <strong x-text="entry.category"></strong>
                                <div class="entry-header-actions">
                                  <label class="resume-toggle" title="Include in Resume">
                                    <span class="ui-badge resume-tag">R</span>
                                    <input type="checkbox" :checked="isResumeEntry(sec.file, ei)" @change="toggleResumeEntry(sec.file, ei)">
                                  </label>
                                  <button class="btn-danger btn-xs" @click="removeEntry(sec, ei)">Remove</button>
                                </div>
                              </div>
                              <label>Category <input type="text" x-model="entry.category"></label>
                              <label>Skills <input type="text" x-model="entry.skills"></label>
                            </div>
                          </template>
                          <button class="btn-sm" @click="sec._data.entries.push({ category: '', skills: '' })">+ Add Skill</button>
                        </div>
                      </template>

                      <!-- cvhonors editor -->
                      <template x-if="sec._data.type === 'cvhonors'">
                        <div>
                          <template x-for="(entry, ei) in sec._data.entries" :key="ei">
                            <div class="entry-card compact" :class="{ 'resume-off': !isResumeEntry(sec.file, ei) }">
                              <div class="entry-header">
                                <strong x-text="entry.award"></strong>
                                <div class="entry-header-actions">
                                  <label class="resume-toggle" title="Include in Resume">
                                    <span class="ui-badge resume-tag">R</span>
                                    <input type="checkbox" :checked="isResumeEntry(sec.file, ei)" @change="toggleResumeEntry(sec.file, ei)">
                                  </label>
                                  <button class="btn-danger btn-xs" @click="removeEntry(sec, ei)">Remove</button>
                                </div>
                              </div>
                              <label>Award <input type="text" x-model="entry.award"></label>
                              <label>Issuer <input type="text" x-model="entry.issuer"></label>
                              <label>Location <input type="text" x-model="entry.location"></label>
                              <label>Date <input type="text" x-model="entry.date"></label>
                            </div>
                          </template>
                          <button class="btn-sm" @click="sec._data.entries.push({ award: '', issuer: '', location: '', date: '' })">+ Add Honor</button>
                        </div>
                      </template>

                      <!-- cvreferences editor -->
                      <template x-if="sec._data.type === 'cvreferences'">
                        <div>
                          <template x-for="(entry, ei) in sec._data.entries" :key="ei">
                            <div class="entry-card compact" :class="{ 'resume-off': !isResumeEntry(sec.file, ei) }">
                              <div class="entry-header">
                                <strong x-text="entry.name"></strong>
                                <div class="entry-header-actions">
                                  <label class="resume-toggle" title="Include in Resume">
                                    <span class="ui-badge resume-tag">R</span>
                                    <input type="checkbox" :checked="isResumeEntry(sec.file, ei)" @change="toggleResumeEntry(sec.file, ei)">
                                  </label>
                                  <button class="btn-danger btn-xs" @click="removeEntry(sec, ei)">Remove</button>
                                </div>
                              </div>
                              <label>Name <input type="text" x-model="entry.name"></label>
                              <label>Relation <input type="text" x-model="entry.relation"></label>
                              <label>Phone <input type="text" x-model="entry.phone"></label>
                              <label>Email <input type="text" x-model="entry.email"></label>
                            </div>
                          </template>
                          <button class="btn-sm" @click="sec._data.entries.push({ name: '', relation: '', phone: '', email: '' })">+ Add Reference</button>
                        </div>
                      </template>

                      <!-- cvparagraph editor -->
                      <template x-if="sec._data.type === 'cvparagraph'">
                        <div>
                          <label class="paragraph-label">CV Text</label>
                          <textarea x-model="sec._data.text" rows="4" class="full-width" aria-label="CV summary text"></textarea>
                          <template x-if="isResumeSection(sec.file)">
                            <div>
                              <label class="paragraph-label">Resume Text <span class="muted">(shorter version for resume)</span></label>
                              <textarea :value="getResumeText(sec.file)" @change="setResumeText(sec.file, $event.target.value)" rows="3" class="full-width" aria-label="Resume summary text"></textarea>
                            </div>
                          </template>
                        </div>
                      </template>

                      <div class="entry-actions">
                        <button class="btn save" @click="saveSection(sec)">Save Section</button>
                      </div>
                    </div>
                  </template>
                  <template x-if="!sec._data">
                    <p class="muted">Loading...</p>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Cover Letter view -->
      <template x-if="activeDoc === 'coverletter'">
        <div class="coverletter-editor" x-data="{ cl: null }" x-init="cl = loadCoverletter()">
          <template x-if="cl">
            <div>
              <div class="ui-alert" x-show="statusMsg" x-text="statusMsg" :class="statusType" role="status"></div>

              <h2>Recipient</h2>
              <label>Name <input type="text" x-model="cl.recipient.name"></label>
              <label>Address <textarea x-model="cl.recipient.address" rows="3"></textarea></label>

              <h2>Letter Details</h2>
              <label>Title <input type="text" x-model="cl.title"></label>
              <label>Opening <input type="text" x-model="cl.opening"></label>
              <label>Closing <input type="text" x-model="cl.closing"></label>
              <label>Enclosure Label <input type="text" x-model="cl.enclosure.label"></label>
              <label>Enclosure Content <input type="text" x-model="cl.enclosure.content"></label>

              <h2>Sections</h2>
              <template x-for="(sec, si) in cl.sections" :key="si">
                <div class="entry-card">
                  <label>Section Title <input type="text" x-model="sec.title"></label>
                  <label>Body <textarea x-model="sec.body" rows="6" class="full-width"></textarea></label>
                  <button class="btn-danger btn-xs" @click="cl.sections.splice(si, 1)">Remove Section</button>
                </div>
              </template>
              <button class="btn-sm" @click="cl.sections.push({ title: '', body: '' })">+ Add Section</button>

              <div class="entry-actions">
                <button class="btn save" @click="saveCoverletter(cl)">Save Cover Letter</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- ===== Cover Letter Tab ===== -->
      <div x-show="editorTab === 'coverletter'" class="tab-content">
        <div class="coverletter-editor">
          <h2>Recipient</h2>
          <label>Name <input type="text" x-model="coverletter.settings.recipientName" @input="autoSaveCoverletterSetting('recipientName')"></label>
          <label>Address <textarea x-model="coverletter.settings.recipientAddress" @input="autoSaveCoverletterSetting('recipientAddress')" rows="3"></textarea></label>

          <h2>Letter Details</h2>
          <label>Title <input type="text" x-model="coverletter.settings.title" @input="autoSaveCoverletterSetting('title')"></label>
          <label>Opening <input type="text" x-model="coverletter.settings.opening" @input="autoSaveCoverletterSetting('opening')"></label>
          <label>Closing <input type="text" x-model="coverletter.settings.closing" @input="autoSaveCoverletterSetting('closing')"></label>
          <label>Enclosure Label <input type="text" x-model="coverletter.settings.enclosureLabel" @input="autoSaveCoverletterSetting('enclosureLabel')"></label>
          <label>Enclosure Content <input type="text" x-model="coverletter.settings.enclosureContent" @input="autoSaveCoverletterSetting('enclosureContent')"></label>

          <h2>Sections</h2>
          <template x-for="sec in coverletter.sections" :key="sec.id">
            <div class="entry-card">
              <label>Section Title <input type="text" x-model="sec.title" @input="autoSaveCoverletterSection(sec)"></label>
              <label>Body <textarea x-model="sec.body" @input="autoSaveCoverletterSection(sec)" rows="6" class="full-width"></textarea></label>
              <button class="btn-danger btn-xs" @click="removeCoverletterSection(sec.id)">Remove Section</button>
            </div>
          </template>
          <button class="btn-sm" @click="addCoverletterSection()">+ Add Section</button>
        </div>
      </div>

      <!-- ===== Style Tab ===== -->
      <div x-show="editorTab === 'style'" class="tab-content">
        <div class="style-editor">
          <h2>Page</h2>
          <label>Page Size
            <select x-model="style.pageSize" @change="autoSaveStyle('pageSize')">
              <option value="letterpaper">Letter</option>
              <option value="a4paper">A4</option>
            </select>
          </label>
          <label>Font Size
            <select x-model="style.fontSize" @change="autoSaveStyle('fontSize')">
              <option value="10pt">10pt</option>
              <option value="11pt">11pt</option>
              <option value="12pt">12pt</option>
            </select>
          </label>

          <h2>Typography</h2>
          <label>Font Family
            <select x-model="style.fontFamily" @change="autoSaveStyle('fontFamily')">
              <option value="source-sans-3">Source Sans 3</option>
              <option value="roboto">Roboto</option>
            </select>
          </label>

          <h2>Accent Color</h2>
          <div class="color-swatches">
            <button class="color-swatch" style="background:#00A388" :class="{ active: style.accentColor === 'awesome-emerald' }" @click="setAccentColor('awesome-emerald')" title="Emerald"></button>
            <button class="color-swatch" style="background:#0395DE" :class="{ active: style.accentColor === 'awesome-skyblue' }" @click="setAccentColor('awesome-skyblue')" title="Sky Blue"></button>
            <button class="color-swatch" style="background:#DC3522" :class="{ active: style.accentColor === 'awesome-red' }" @click="setAccentColor('awesome-red')" title="Red"></button>
            <button class="color-swatch" style="background:#EF4089" :class="{ active: style.accentColor === 'awesome-pink' }" @click="setAccentColor('awesome-pink')" title="Pink"></button>
            <button class="color-swatch" style="background:#FF6138" :class="{ active: style.accentColor === 'awesome-orange' }" @click="setAccentColor('awesome-orange')" title="Orange"></button>
            <button class="color-swatch" style="background:#27AE60" :class="{ active: style.accentColor === 'awesome-nephritis' }" @click="setAccentColor('awesome-nephritis')" title="Nephritis"></button>
            <button class="color-swatch" style="background:#95A5A6" :class="{ active: style.accentColor === 'awesome-concrete' }" @click="setAccentColor('awesome-concrete')" title="Concrete"></button>
            <button class="color-swatch" style="background:#131A28" :class="{ active: style.accentColor === 'awesome-darknight' }" @click="setAccentColor('awesome-darknight')" title="Dark Night"></button>
            <button class="color-swatch" style="background:#B21F5C" :class="{ active: style.accentColor === 'spinel' }" @click="setAccentColor('spinel')" title="Spinel"></button>
          </div>
          <label>Custom Color
            <div class="custom-color-row">
              <input type="text" x-model="style.customHex" @input="applyCustomColor()" placeholder="#B21F5C" maxlength="7">
              <span class="color-preview" :style="'background:' + (style.customHex || '#000')"></span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- Resize handle -->
    <div class="ui-resize-handle ui-resize-v" id="resize-handle"></div>

    <!-- Right column: PDF preview -->
    <div class="right-col">
      <div class="ui-tabs">
        <button class="ui-tab" :class="{ active: pdfTab === 'cv' }" @click="switchPdfTab('cv')">CV</button>
        <button class="ui-tab" :class="{ active: pdfTab === 'resume' }" @click="switchPdfTab('resume')">Resume</button>
        <button class="ui-tab" :class="{ active: pdfTab === 'coverletter' }" @click="switchPdfTab('coverletter')">Cover Ltr</button>
      </div>
      <iframe :src="pdfUrl" class="pdf-iframe" title="Compiled PDF preview"></iframe>
    </div>
  </div>

  <script src="https://andypeterson2.github.io/ui-kit/icons.js"></script>
  <script src="https://andypeterson2.github.io/ui-kit/ui-kit.js"></script>
  <script>const API_BASE = (typeof ServiceConfig !== 'undefined' && ServiceConfig.get) ? ServiceConfig.get("cv", "https://localhost:3000") : "https://localhost:3000";</script>
  <script src="/storage.js"></script>
  <script src="/app.js"></script>
  <script>
    (function() {
      var el = document.getElementById('backend-connect');
      if (el && window.UIKit && UIKit.initConnect) {
        UIKit.initConnect(el, {
          service: 'cv',
          defaultHost: 'localhost',
          defaultPort: 3000,
          label: 'Backend'
        });
      }
    })();
  </script>
</body>
</html>
